version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: saas_user
      POSTGRES_PASSWORD: saas_password
      POSTGRES_DB: saas_cx_platform
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - saas_network

  # Backend API
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      DATABASE_URL: "postgresql://saas_user:saas_password@postgres:5432/saas_cx_platform"
      NODE_ENV: development
      JWT_SECRET: "your-development-jwt-secret"
      FRONTEND_URL: "http://localhost:3000"
    depends_on:
      - postgres
    networks:
      - saas_network
    volumes:
      - ./apps/api:/app
      - /app/node_modules

  # Frontend Web App
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NEXTAUTH_URL: "http://localhost:3000"
      NEXTAUTH_SECRET: "your-development-nextauth-secret"
      DATABASE_URL: "postgresql://saas_user:saas_password@postgres:5432/saas_cx_platform"
    depends_on:
      - api
      - postgres
    networks:
      - saas_network
    volumes:
      - ./apps/web:/app
      - /app/node_modules

volumes:
  postgres_data:

networks:
  saas_network:
    driver: bridge